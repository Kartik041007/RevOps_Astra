<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>RevOps Astra — AI Robot</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            overflow: hidden;
            background:
                radial-gradient(ellipse at center, #ffffff 0%, #eef0ff 55%, #e5e8ff 100%);
            font-family: Inter, Arial, sans-serif;
            color: #202746;
        }

        .scene {
            width: min(900px, 100%);
            height: 650px;
            position: relative;
            display: grid;
            place-items: center;
            isolation: isolate;
        }

        .ambient {
            position: absolute;
            width: 390px;
            height: 390px;
            border-radius: 50%;
            background: radial-gradient(circle, #f9c66c50, #9d8bff20 60%, transparent 72%);
            filter: blur(8px);
            z-index: -2;
        }

        .robot-wrap {
            position: relative;
            width: 260px;
            height: 380px;
            animation: float 4s ease-in-out infinite;
            filter: drop-shadow(0 28px 24px #7c65b52c);
            z-index: 2;
        }

        .robot {
            position: absolute;
            inset: 0;
        }

        /* Head */
        .head {
            position: absolute;
            top: 15px;
            left: 28px;
            width: 204px;
            height: 157px;
            border-radius: 46% 46% 39% 39%;
            background: linear-gradient(145deg, #ffe7a0 0%, #f6c75c 28%, #d98b24 72%, #f4bd51 100%);
            box-shadow:
                inset 7px 7px 8px #fff4c9,
                inset -8px -9px 10px #b66a1d,
                0 9px 0 #d9a142;
            transform: rotate(-2deg);
        }

        .head::before {
            content: "";
            position: absolute;
            inset: 10px 10px 12px;
            border-radius: 45% 45% 36% 36%;
            border: 2px solid #ffedb7a0;
            box-shadow: inset 0 3px 5px #a9672e35;
        }

        /* Face screen */
        .face {
            position: absolute;
            left: 17px;
            top: 24px;
            width: 170px;
            height: 94px;
            border-radius: 44px;
            background: linear-gradient(155deg, #4e4b4a, #181c2a 50%, #4b4139);
            border: 5px solid #c99544;
            box-shadow:
                inset 0 5px 12px #0009,
                0 3px 2px #fff0b0;
            overflow: hidden;
        }

        .face::before {
            content: "";
            position: absolute;
            inset: 4px;
            border-radius: 35px;
            background: linear-gradient(145deg, #777b85, #d7d0c4 48%, #77757a);
            opacity: .85;
        }

        /* Eyes */
        .eye {
            position: absolute;
            top: 28px;
            width: 29px;
            height: 31px;
            border-radius: 50%;
            background:
                radial-gradient(circle at 34% 27%, white 0 10%, transparent 12%),
                radial-gradient(circle at 63% 70%, #070e28 0 30%, #203a70 43%, #5277a3 64%, #111a32 69%);
            border: 2px solid #b2b9c4;
            box-shadow: 0 2px 5px #1118;
            z-index: 1;
            animation: blink 5s infinite;
        }

        .eye.left {
            left: 31px;
        }

        .eye.right {
            right: 31px;
        }

        /* Side headphones */
        .ear {
            position: absolute;
            top: 61px;
            width: 26px;
            height: 53px;
            border-radius: 12px;
            background: linear-gradient(90deg, #bd711e, #ffe49a, #dc8d26);
            box-shadow: inset 3px 0 4px #fff5b4, 0 4px 5px #a8652b55;
        }

        .ear.left {
            left: 9px;
        }

        .ear.right {
            right: 9px;
        }

        /* Body */
        .body {
            position: absolute;
            top: 163px;
            left: 42px;
            width: 176px;
            height: 173px;
            border-radius: 43px 43px 37px 37px;
            background: linear-gradient(145deg, #fff0ad, #f4c55f 38%, #dc922c 76%, #f8ca68);
            border: 3px solid #e6af4a;
            box-shadow:
                inset 7px 7px 10px #fff6ca,
                inset -8px -7px 10px #c77a24,
                0 9px 0 #d28d32;
        }

        .body-panel {
            position: absolute;
            inset: 12px 10px 12px;
            border-radius: 34px;
            border: 2px solid #ffedb1;
            box-shadow: inset 0 5px 10px #d2913338;
        }

        .body-light {
            position: absolute;
            top: 29px;
            right: 23px;
            display: grid;
            gap: 7px;
        }

        .body-light i {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: linear-gradient(135deg, #56504b, #181c25);
            box-shadow: 0 1px 2px #fff3b0;
        }

        /* Arms */
        .arm {
            position: absolute;
            top: 190px;
            width: 38px;
            height: 109px;
            border-radius: 22px;
            background: linear-gradient(90deg, #c87520, #f9bf50 40%, #ffdb7d 70%, #d17d25);
            box-shadow: inset 5px 0 6px #ffe6a2, 0 7px 9px #b57a2b33;
        }

        .arm.left {
            left: 12px;
            transform: rotate(5deg);
        }

        .arm.right {
            right: 12px;
            transform: rotate(-5deg);
        }

        /* Floating words */
        .word {
            position: absolute;
            padding: 12px 17px;
            border: 1px solid #ffffffd9;
            border-radius: 14px;
            background: #ffffffbd;
            backdrop-filter: blur(12px);
            box-shadow: 0 12px 30px #6d69b21b;
            font-size: 13px;
            font-weight: 700;
            color: #5552a0;
            white-space: nowrap;
            animation: wordFloat 5s ease-in-out infinite;
        }

        .word span {
            margin-right: 7px;
        }

        .w1 {
            top: 125px;
            left: 8%;
            animation-delay: -.5s;
        }

        .w2 {
            top: 210px;
            right: 6%;
            animation-delay: -2s;
        }

        .w3 {
            bottom: 150px;
            left: 7%;
            animation-delay: -3s;
        }

        .w4 {
            bottom: 115px;
            right: 9%;
            animation-delay: -1s;
        }

        .w5 {
            top: 65px;
            right: 23%;
            animation-delay: -2.5s;
        }

        .orbit {
            position: absolute;
            width: 450px;
            height: 450px;
            border: 1px solid #aaa7e83d;
            border-radius: 50%;
            z-index: -1;
        }

        .orbit::before,
        .orbit::after {
            content: "";
            position: absolute;
            border: 1px dashed #9c97e84a;
            border-radius: 50%;
            inset: 28px;
        }

        .orbit::after {
            inset: 60px;
        }

        .caption {
            position: absolute;
            bottom: 24px;
            text-align: center;
        }

        .caption h2 {
            margin: 0;
            font-size: 25px;
            letter-spacing: -.7px;
        }

        .caption h2 span {
            color: #7c65e9;
        }

        .caption p {
            margin: 9px 0 0;
            color: #7d849d;
            font-size: 13px;
        }

        .online {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            margin-top: 13px;
            color: #299c72;
            font-size: 11px;
            font-weight: 700;
        }

        .online i {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #35d69a;
            box-shadow: 0 0 10px #35d69a;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0) rotate(-1deg);
            }

            50% {
                transform: translateY(-16px) rotate(1deg);
            }
        }

        @keyframes wordFloat {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-11px);
            }
        }

        @keyframes blink {

            0%,
            44%,
            48%,
            100% {
                transform: scaleY(1);
            }

            46% {
                transform: scaleY(.12);
            }
        }

        @media (max-width: 600px) {
            .scene {
                height: 620px;
                transform: scale(.82);
            }

            .w1 {
                left: 1%;
            }

            .w2 {
                right: 0;
            }

            .w3 {
                left: 0;
            }

            .w4 {
                right: 0;
            }

            .w5 {
                right: 5%;
            }
        }

        /* ASTRA AI brief interface */
        .agent-panel {
            position: absolute;
            top: 18px;
            left: 18px;
            z-index: 5;
            width: min(390px, 46%);
            max-height: calc(100% - 36px);
            overflow-y: auto;
            padding: 16px;
            border: 1px solid #ffffff;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.92);
            box-shadow: 0 12px 30px #5552a020;
            backdrop-filter: blur(12px);
        }

        .agent-panel h3 {
            margin: 0 0 8px;
            font-size: 18px;
        }

        .agent-panel p {
            margin: 0 0 12px;
            color: #68708a;
            font-size: 12px;
        }

        .agent-panel input,
        .agent-panel button {
            width: 100%;
            padding: 11px;
            border-radius: 10px;
            font: inherit;
        }

        .agent-panel input {
            margin-bottom: 8px;
            border: 1px solid #d9dced;
        }

        .agent-panel button {
            border: 0;
            background: #6555d9;
            color: white;
            font-weight: 700;
            cursor: pointer;
        }

        .agent-panel button:disabled {
            opacity: .6;
            cursor: wait;
        }

        .agent-result {
            margin-top: 14px;
            font-size: 13px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .agent-result h4 {
            margin: 12px 0 4px;
            color: #33316f;
        }

        .agent-result pre {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            font: inherit;
        }

        /* Floating Action Queue Button replacing Account Health (w5) */
        button.action-queue-btn {
            font-family: inherit;
            cursor: pointer;
            border: 1px solid #ffffffd9;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
            outline: none;
            user-select: none;
        }

        button.action-queue-btn:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 14px 32px rgba(85, 82, 160, 0.25);
            background: #ffffff;
        }

        button.action-queue-btn:focus-visible {
            box-shadow: 0 0 0 3px #9d8bff80, 0 12px 30px #6d69b21b;
        }

        button.action-queue-btn:active {
            transform: scale(0.98);
        }

        .queue-btn-icon {
            font-size: 14px;
        }

        .queue-btn-label {
            font-weight: 700;
        }

        /* Dynamic badge for pending approvals */
        .queue-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 22px;
            height: 22px;
            padding: 0 7px;
            border-radius: 999px;
            background: #6555d9;
            color: #ffffff;
            font-size: 11px;
            font-weight: 800;
            line-height: 1;
            letter-spacing: 0.2px;
            box-shadow: 0 2px 6px rgba(101, 85, 217, 0.35);
            transition: all 0.25s ease;
        }

        .queue-badge.has-pending {
            background: #e63946;
            box-shadow: 0 2px 8px rgba(230, 57, 70, 0.45);
            animation: badgePulse 2s ease-in-out infinite;
        }

        @keyframes badgePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.12); }
        }

        /* Separate Floating Action Queue Panel */
        .queue-panel {
            position: absolute;
            top: 18px;
            right: 18px;
            z-index: 20;
            width: min(430px, calc(100% - 36px));
            max-height: calc(100% - 36px);
            display: flex;
            flex-direction: column;
            padding: 16px;
            border: 1px solid #ffffff;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.96);
            box-shadow: 0 16px 45px rgba(50, 45, 110, 0.22);
            backdrop-filter: blur(16px);
            animation: panelFadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
        }

        .queue-panel[hidden] {
            display: none !important;
        }

        @keyframes panelFadeIn {
            from {
                opacity: 0;
                transform: translateY(-8px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .queue-panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid #edf0f8;
            flex-shrink: 0;
        }

        .queue-panel-title-wrap {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .queue-panel-title-wrap h3 {
            margin: 0;
            font-size: 17px;
            font-weight: 800;
            color: #202746;
        }

        .queue-panel-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .queue-action-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 6px 12px;
            border: 1px solid #d9dced;
            border-radius: 9px;
            background: #f7f8fc;
            color: #4a4d68;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .queue-action-btn:hover:not(:disabled) {
            background: #edeef8;
            color: #33316f;
            border-color: #c4c8de;
        }

        .queue-action-btn:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .queue-close-btn {
            display: grid;
            place-items: center;
            width: 32px;
            height: 32px;
            border: 0;
            border-radius: 50%;
            background: #f0f2fa;
            color: #555870;
            font-size: 20px;
            line-height: 1;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .queue-close-btn:hover {
            background: #e2e5f2;
            color: #1a1c29;
            transform: scale(1.06);
        }

        .queue-loading {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            margin: 10px 0 6px;
            border-radius: 10px;
            background: #f0f2ff;
            color: #4f46a5;
            font-size: 12px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .queue-loading[hidden] {
            display: none !important;
        }

        .queue-spinner {
            width: 14px;
            height: 14px;
            border: 2px solid #b8b3f2;
            border-top-color: #6555d9;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .integration-note,
        .queue-message,
        .empty-queue {
            margin: 8px 0;
            color: #68708a;
            font-size: 12px;
            line-height: 1.5;
            flex-shrink: 0;
        }

        .queue-message.error {
            color: #a32a39;
            background: #fff0f1;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #fcd2d7;
        }

        .queue-message.success {
            color: #1b6d46;
            background: #e9f8ef;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #bfead0;
        }

        .queue-message.loading {
            color: #4f46a5;
        }

        .empty-queue {
            padding: 24px 16px;
            text-align: center;
            background: #f8f9fd;
            border: 1px dashed #d5d8ea;
            border-radius: 12px;
            color: #727793;
            font-size: 13px;
        }

        .queue-list {
            display: grid;
            gap: 12px;
            overflow-y: auto;
            padding: 6px 2px 8px 0;
            margin-top: 6px;
            flex-grow: 1;
            scrollbar-width: thin;
        }

        .queue-list::-webkit-scrollbar {
            width: 6px;
        }

        .queue-list::-webkit-scrollbar-thumb {
            background: #d2d5e8;
            border-radius: 3px;
        }

        /* Action Cards */
        .action-card {
            padding: 14px;
            border: 1px solid #e5e7f2;
            border-radius: 14px;
            background: #ffffff;
            box-shadow: 0 4px 12px rgba(60, 55, 120, 0.05);
            overflow-wrap: anywhere;
            word-break: break-word;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .action-card:hover {
            box-shadow: 0 6px 18px rgba(60, 55, 120, 0.1);
        }

        .action-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 8px;
        }

        .action-card-id {
            font-size: 11px;
            font-weight: 700;
            color: #7b809a;
            font-family: monospace;
            word-break: break-all;
        }

        .action-card-customer {
            margin: 0 0 4px;
            font-size: 14px;
            font-weight: 800;
            color: #242250;
        }

        .action-card-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 10px;
        }

        .risk-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 999px;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .risk-badge[data-risk="Urgent"],
        .risk-badge[data-risk="High"] {
            background: #ffe8eb;
            color: #d92d43;
        }

        .risk-badge[data-risk="Needs Review"] {
            background: #f2e9fc;
            color: #8c4ad6;
        }

        .risk-badge[data-risk="Healthy"] {
            background: #e2f9ed;
            color: #179354;
        }

        .risk-badge:not([data-risk]) {
            background: #f0f2f8;
            color: #636882;
        }

        .action-status {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 999px;
            background: #efefff;
            color: #4f46a5;
            font-size: 10px;
            font-weight: 800;
        }

        .action-status[data-status="REJECTED"],
        .action-status[data-status="FAILED"] {
            color: #a33d4b;
            background: #fff0f1;
        }

        .action-status[data-status="APPROVED"] {
            color: #1b6d46;
            background: #e9f8ef;
        }

        .action-status[data-status="COMPLETED"] {
            color: #207752;
            background: #e9f8ef;
        }

        .action-section-title {
            margin: 10px 0 3px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: #5552a0;
        }

        .action-card p {
            margin: 3px 0 8px;
            color: #4a4e69;
            font-size: 12px;
            line-height: 1.45;
        }

        .action-section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 10px 0 4px;
        }

        .action-section-header .action-section-title {
            margin: 0;
        }

        .edit-email-btn {
            padding: 4px 10px !important;
            font-size: 11px !important;
            border-radius: 6px !important;
            background: #edeef8 !important;
            color: #4a46a5 !important;
            border: 1px solid #dcdff2 !important;
            cursor: pointer;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s ease;
        }

        .edit-email-btn:hover {
            background: #e2e4f6 !important;
            color: #33316f !important;
            border-color: #c8ccee !important;
        }

        .action-email-box {
            margin: 4px 0 10px;
            padding: 10px;
            border-radius: 9px;
            background: #f8f9fe;
            border: 1px solid #e9ebf6;
        }

        .action-email-box[hidden] {
            display: none !important;
        }

        .action-email-subject {
            font-size: 12px;
            font-weight: 700;
            color: #2b285b;
            margin-bottom: 6px;
        }

        .action-email-body {
            margin: 0;
            font-size: 11px;
            line-height: 1.5;
            color: #4c516d;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            font-family: inherit;
        }

        .action-email-editor {
            margin: 6px 0 10px;
            padding: 12px;
            border-radius: 12px;
            background: #fbfbfe;
            border: 1px solid #dcdff2;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .action-email-editor[hidden] {
            display: none !important;
        }

        .editor-field-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .editor-label {
            font-size: 11px;
            font-weight: 700;
            color: #5552a0;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .editor-subject-input,
        .editor-body-textarea {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #d9dced;
            border-radius: 8px;
            font-family: inherit;
            font-size: 12px;
            box-sizing: border-box;
            background: #ffffff;
            color: #202746;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .editor-subject-input:focus,
        .editor-body-textarea:focus {
            outline: none;
            border-color: #6555d9;
            box-shadow: 0 0 0 3px rgba(101, 85, 217, 0.15);
        }

        .editor-body-textarea {
            resize: vertical;
            min-height: 90px;
            line-height: 1.45;
        }

        .editor-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
        }

        .save-draft-btn {
            background: #6555d9 !important;
            color: #ffffff !important;
            padding: 6px 14px !important;
            font-size: 11px !important;
            border-radius: 7px !important;
        }

        .save-draft-btn:hover:not(:disabled) {
            background: #5140cb !important;
        }

        .cancel-edit-btn {
            background: #f0f2f8 !important;
            color: #525672 !important;
            border: 1px solid #dcdff2 !important;
            padding: 6px 12px !important;
            font-size: 11px !important;
            border-radius: 7px !important;
        }

        .cancel-edit-btn:hover:not(:disabled) {
            background: #e4e7f2 !important;
            color: #202746 !important;
        }

        .editor-status {
            font-size: 11px;
            line-height: 1.4;
            padding: 4px 8px;
            border-radius: 6px;
        }

        .editor-status:empty {
            display: none;
        }

        .editor-status.error {
            background: #fff0f1;
            color: #a32a39;
            border: 1px solid #fcd2d7;
        }

        .editor-status.success {
            background: #e9f8ef;
            color: #1b6d46;
            border: 1px solid #bfead0;
        }

        .editor-status.loading {
            background: #f0f2ff;
            color: #4f46a5;
        }

        .unsaved-warning {
            font-size: 11px;
            color: #a32a39;
            background: #fff0f1;
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #fcd2d7;
            margin-top: 6px;
            width: 100%;
        }

        .unsaved-warning:empty {
            display: none;
        }

        .action-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid #f0f2f8;
        }

        .action-controls button,
        .proposal-button {
            width: auto;
            padding: 8px 14px;
            font-size: 12px;
            border-radius: 8px;
            border: 0;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.2s ease;
        }

        .action-controls .approve-button {
            background: #1b6d46;
            color: #ffffff;
        }

        .action-controls .approve-button:hover:not(:disabled) {
            background: #155737;
        }

        .action-controls .reject-button {
            background: #9b4252;
            color: #ffffff;
        }

        .action-controls .reject-button:hover:not(:disabled) {
            background: #7d3441;
        }

        .action-controls button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .rejection-reason {
            width: 100%;
            min-height: 64px;
            margin-top: 6px;
            padding: 8px;
            border: 1px solid #d9dced;
            border-radius: 8px;
            resize: vertical;
            font: inherit;
            font-size: 12px;
            box-sizing: border-box;
        }

        .rejection-reason:focus {
            border-color: #9d8bff;
            outline: none;
        }

        .proposal-button {
            margin-top: 12px;
            background: #6555d9;
            color: white;
        }

        .proposal-button:hover:not(:disabled) {
            background: #5344be;
        }

        .proposal-button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        /* Proposal Status and Retry */
        .proposal-status {
            margin: 10px 0;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 12px;
            line-height: 1.45;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .proposal-status:empty {
            display: none;
        }

        .proposal-status.loading {
            background: #f0f2ff;
            color: #4f46a5;
        }

        .proposal-status.success {
            background: #e9f8ef;
            color: #1b6d46;
            border: 1px solid #bfead0;
        }

        .proposal-status.error {
            background: #fff0f1;
            color: #a32a39;
            border: 1px solid #fcd2d7;
        }

        .proposal-status.warning {
            background: #fff8e8;
            color: #9c6500;
            border: 1px solid #fde4a8;
        }

        .retry-button {
            align-self: flex-start;
            padding: 6px 12px;
            border: 1px solid #d9a742;
            border-radius: 8px;
            background: #ffffff;
            color: #8c5900;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .retry-button:hover:not(:disabled) {
            background: #fef4dc;
        }

        .retry-button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        @media (max-width: 768px) {
            .queue-panel {
                top: 12px;
                right: 12px;
                left: 12px;
                width: auto;
                max-width: calc(100% - 24px);
                max-height: calc(100% - 24px);
                z-index: 100;
            }
        }

        @media (max-width: 650px) {
            body {
                overflow: auto;
            }

            .scene {
                width: 100%;
                min-height: 100vh;
                height: auto;
                display: block;
                transform: none;
                padding: 12px;
            }

            .agent-panel {
                position: relative;
                top: auto;
                left: auto;
                width: 100%;
                max-height: min(78vh, 720px);
                margin: 0 auto 300px;
            }

            .robot-wrap {
                position: absolute;
                top: 410px;
                left: 50%;
                transform: translateX(-50%);
            }

            .caption {
                position: absolute;
                top: 770px;
                bottom: auto;
                width: calc(100% - 24px);
            }

            .word,
            .ambient,
            .orbit {
                display: none;
            }

            .action-queue-btn {
                display: inline-flex !important;
                position: fixed;
                top: 12px;
                right: 12px;
                z-index: 1000;
                animation: none;
                box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
            }

            .queue-panel {
                position: fixed;
                inset: 10px;
                width: auto;
                max-width: 100%;
                max-height: calc(100vh - 20px);
                z-index: 2000;
            }
        }
    </style>
</head>

<body>
    <div class="scene">

        <!-- ASTRA Intelligence Customer Brief Panel -->
        <section class="agent-panel">
            <h3>✦ ASTRA Intelligence</h3>
            <p>Generate an evidence-based customer brief.</p>

            <form id="briefForm">
                <input id="accountId" name="account_id" type="text" maxlength="64"
                    placeholder="Enter account ID" required>
                <button id="generateBrief" type="submit">
                    Generate Customer Brief
                </button>
            </form>

            <div id="briefStatus" role="status" aria-live="polite"></div>
            <div id="briefResult" class="agent-result"></div>
            <button id="queueProposal" class="proposal-button" type="button" hidden>
                Submit email draft for approval
            </button>
            <div id="proposalStatus" class="proposal-status" role="status" aria-live="polite"></div>
        </section>

        <!-- Separate Floating Action Queue Panel -->
        <section id="queuePanel" class="queue-panel" hidden role="dialog" aria-modal="false" aria-labelledby="queueTitle">
            <div class="queue-panel-header">
                <div class="queue-panel-title-wrap">
                    <h3 id="queueTitle">📋 Action Queue</h3>
                    <span id="queueHeaderBadge" class="queue-badge" title="Pending approvals">0</span>
                </div>
                <div class="queue-panel-actions">
                    <button id="refreshQueue" type="button" class="queue-action-btn" title="Refresh Action Queue">
                        <span class="btn-icon">🔄</span> Refresh
                    </button>
                    <button id="closeQueue" type="button" class="queue-close-btn" aria-label="Close Action Queue" title="Close">×</button>
                </div>
            </div>

            <p id="integrationStatus" class="integration-note">
                Integration status: checking configuration…
            </p>

            <div id="queueLoading" class="queue-loading" hidden role="status" aria-live="polite">
                <span class="queue-spinner" aria-hidden="true"></span>
                <span>Loading actions…</span>
            </div>

            <div id="queueStatus" class="queue-message" role="status" aria-live="polite"></div>

            <div id="actionQueue" class="queue-list" aria-live="polite"></div>
        </section>

        <div class="ambient"></div>
        <div class="orbit"></div>

        <div class="word w1"><span>⚡</span>Customer Risk</div>
        <div class="word w2"><span>📊</span>Revenue Insights</div>
        <div class="word w3"><span>🛡️</span>Churn Alert</div>
        <div class="word w4"><span>✦</span>AI Intelligence</div>
        <button id="openQueueButton" class="word w5 action-queue-btn" type="button" aria-haspopup="dialog" aria-expanded="false" title="Open Action Queue">
            <span class="queue-btn-icon">📋</span>
            <span class="queue-btn-label">Action Queue</span>
            <span id="queueBadge" class="queue-badge" aria-label="Pending approvals">0</span>
        </button>

        <div class="robot-wrap">
            <div class="robot">
                <div class="ear left"></div>
                <div class="ear right"></div>

                <div class="head">
                    <div class="face">
                        <div class="eye left"></div>
                        <div class="eye right"></div>
                    </div>
                </div>

                <div class="arm left"></div>
                <div class="arm right"></div>

                <div class="body">
                    <div class="body-panel"></div>
                    <div class="body-light">
                        <i></i><i></i><i></i>
                    </div>
                </div>
            </div>
        </div>

        <div class="caption">
            <h2>Meet <span>ASTRA AI</span></h2>
            <p>Your intelligent revenue operations companion</p>
            <div class="online"><i></i> AI ASSISTANT READY</div>
        </div>
    </div>

<script>
(() => {
    const form = document.getElementById("briefForm");
    const accountInput = document.getElementById("accountId");
    const button = document.getElementById("generateBrief");
    const status = document.getElementById("briefStatus");
    const result = document.getElementById("briefResult");
    const queuePanel = document.getElementById("queuePanel");
    const openQueueButton = document.getElementById("openQueueButton");
    const closeQueue = document.getElementById("closeQueue");
    const refreshQueue = document.getElementById("refreshQueue");
    const queueBadge = document.getElementById("queueBadge");
    const queueHeaderBadge = document.getElementById("queueHeaderBadge");
    const queueLoading = document.getElementById("queueLoading");
    const queue = document.getElementById("actionQueue");
    const queueStatus = document.getElementById("queueStatus");
    const integrationStatus = document.getElementById("integrationStatus");
    const queueProposal = document.getElementById("queueProposal");
    const proposalStatus = document.getElementById("proposalStatus");
    const csrfToken = document.querySelector('meta[name="csrf-token"]')?.content || "";

    let currentDraft = null;
    let integrationConfigured = false;
    let isQueueLoading = false;

    if (!form || !accountInput || !button || !status || !result || !queue || !queuePanel || !openQueueButton) return;

    function openQueuePanel() {
        queuePanel.hidden = false;
        openQueueButton.setAttribute("aria-expanded", "true");
        if (closeQueue) closeQueue.focus();
    }

    function closeQueuePanel() {
        queuePanel.hidden = true;
        openQueueButton.setAttribute("aria-expanded", "false");
        openQueueButton.focus();
    }

    openQueueButton.addEventListener("click", () => {
        if (queuePanel.hidden) {
            openQueuePanel();
        } else {
            closeQueuePanel();
        }
    });

    if (closeQueue) {
        closeQueue.addEventListener("click", closeQueuePanel);
    }

    document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && !queuePanel.hidden) {
            closeQueuePanel();
        }
    });

    document.addEventListener("click", (event) => {
        if (
            !queuePanel.hidden &&
            !queuePanel.contains(event.target) &&
            !openQueueButton.contains(event.target)
        ) {
            closeQueuePanel();
        }
    });

    function addText(parent, tag, text) {
        const element = document.createElement(tag);
        element.textContent = text == null ? "" : String(text);
        parent.appendChild(element);
        return element;
    }

    function addParagraph(parent, text) {
        const paragraph = document.createElement("p");
        paragraph.textContent = text || "";
        parent.appendChild(paragraph);
        return paragraph;
    }

    function renderBrief(brief) {
        result.replaceChildren();

        const customer = brief.customer || {};
        const draft = brief.draft || {};

        addText(result, "h4", customer.company_name || brief.account_id);
        addText(
            result,
            "p",
            `Risk: ${customer.risk_level || "Unknown"} · Index: ${customer.risk_index ?? "N/A"}`
        );

        addText(result, "h4", "Issue Summary");
        addText(result, "p", draft.issue_summary || "No summary returned.");

        addText(result, "h4", "Recommended Next Action");
        addText(result, "p", draft.recommended_next_action || "No action returned.");

        addText(result, "h4", "Evidence Used");
        const evidence = Array.isArray(draft.evidence_used)
            ? draft.evidence_used
            : [];

        addText(
            result,
            "p",
            evidence.length ? evidence.join(", ") : "No source IDs returned."
        );

        addText(result, "h4", "Email Draft");
        addText(result, "p", `Subject: ${draft.email_subject || ""}`);
        const email = addText(result, "pre", draft.email_body || "");
        email.style.margin = "0";

        addText(
            result,
            "p",
            "Draft only — no email sent and no CRM changes made."
        );
        currentDraft = {
            accountId: accountInput.value.trim(),
            action: draft.recommended_next_action || "",
            explanation: draft.issue_summary || "",
            subject: draft.email_subject || "",
            body: draft.email_body || "",
            evidence: Array.isArray(draft.evidence_used) ? draft.evidence_used : []
        };
        queueProposal.hidden = !(
            currentDraft.action && currentDraft.explanation &&
            currentDraft.subject && currentDraft.body
        );
        proposalStatus.replaceChildren();
        proposalStatus.className = "proposal-status";
    }

    function statusLabel(status) {
        if (status === "APPROVED") return "Approved — awaiting integration/execution";
        return ({
            PENDING: "Pending",
            REJECTED: "Rejected",
            EXECUTING: "Executing",
            COMPLETED: "Completed",
            FAILED: "Failed",
            ON_HOLD: "On Hold"
        })[status] || status;
    }

    function renderAction(action) {
        const card = document.createElement("article");
        card.className = "action-card";
        card.id = `action-${action.action_id}`;

        const cardHeader = document.createElement("div");
        cardHeader.className = "action-card-header";

        const idSpan = document.createElement("span");
        idSpan.className = "action-card-id";
        idSpan.textContent = `ID: ${action.action_id}`;
        cardHeader.appendChild(idSpan);

        const statusBadge = document.createElement("span");
        statusBadge.className = "action-status";
        statusBadge.dataset.status = action.status;
        statusBadge.textContent = statusLabel(action.status);
        cardHeader.appendChild(statusBadge);
        card.appendChild(cardHeader);

        const customerHeading = document.createElement("h4");
        customerHeading.className = "action-card-customer";
        customerHeading.textContent = `${action.customer_name || "Unknown customer"} (${action.account_id})`;
        card.appendChild(customerHeading);

        const badgesRow = document.createElement("div");
        badgesRow.className = "action-card-badges";
        const riskBadge = document.createElement("span");
        riskBadge.className = "risk-badge";
        riskBadge.dataset.risk = action.risk_level || "Unknown";
        riskBadge.textContent = `Risk: ${action.risk_level || "Unknown"}`;
        badgesRow.appendChild(riskBadge);
        card.appendChild(badgesRow);

        const payload = action.proposed_payload || {};
        addText(card, "h5", "Proposed Action").className = "action-section-title";
        addParagraph(card, payload.proposed_action || "No action details.");

        addText(card, "h5", "Explanation").className = "action-section-title";
        addParagraph(card, payload.explanation || "No explanation provided.");

        const evidence = Array.isArray(action.evidence_refs) ? action.evidence_refs : [];
        addText(card, "h5", "Supporting Evidence").className = "action-section-title";
        addParagraph(card, evidence.length ? evidence.join(", ") : "No evidence references.");

        let subjectInput = null;
        let bodyInput = null;
        let getHasUnsavedEdits = () => false;
        let isEditorOpen = () => false;
        let unsavedWarning = null;

        if (payload.email) {
            const emailHeader = document.createElement("div");
            emailHeader.className = "action-section-header";

            const emailTitle = document.createElement("h5");
            emailTitle.className = "action-section-title";
            emailTitle.textContent = "Proposed Email";
            emailHeader.appendChild(emailTitle);

            let savedSubject = (payload.email.subject || "").trim();
            let savedBody = (payload.email.body || "").trim();
            let editorVisible = false;

            const emailBox = document.createElement("div");
            emailBox.className = "action-email-box";

            const emailSub = document.createElement("div");
            emailSub.className = "action-email-subject";
            emailSub.textContent = `Subject: ${savedSubject}`;
            emailBox.appendChild(emailSub);

            const emailBody = document.createElement("pre");
            emailBody.className = "action-email-body";
            emailBody.textContent = savedBody;
            emailBox.appendChild(emailBody);

            const canEdit = action.status === "PENDING" || action.status === "APPROVED";

            let editBtn = null;
            let editorPanel = null;
            let statusEl = null;

            if (canEdit) {
                editBtn = document.createElement("button");
                editBtn.type = "button";
                editBtn.className = "edit-email-btn";
                editBtn.textContent = "✏️ Edit Email";
                emailHeader.appendChild(editBtn);

                editorPanel = document.createElement("div");
                editorPanel.className = "action-email-editor";
                editorPanel.hidden = true;

                const subjectGroup = document.createElement("div");
                subjectGroup.className = "editor-field-group";
                const subjectLabel = document.createElement("label");
                subjectLabel.className = "editor-label";
                subjectLabel.textContent = "Subject (1–300 chars):";
                subjectInput = document.createElement("input");
                subjectInput.type = "text";
                subjectInput.className = "editor-subject-input";
                subjectInput.maxLength = 300;
                subjectInput.value = savedSubject;
                subjectGroup.append(subjectLabel, subjectInput);

                const bodyGroup = document.createElement("div");
                bodyGroup.className = "editor-field-group";
                const bodyLabel = document.createElement("label");
                bodyLabel.className = "editor-label";
                bodyLabel.textContent = "Email Body (1–10,000 chars):";
                bodyInput = document.createElement("textarea");
                bodyInput.className = "editor-body-textarea";
                bodyInput.rows = 5;
                bodyInput.maxLength = 10000;
                bodyInput.value = savedBody;
                bodyGroup.append(bodyLabel, bodyInput);

                statusEl = document.createElement("div");
                statusEl.className = "editor-status";

                const editorControls = document.createElement("div");
                editorControls.className = "editor-controls";

                const saveDraftBtn = document.createElement("button");
                saveDraftBtn.type = "button";
                saveDraftBtn.className = "save-draft-btn";
                saveDraftBtn.textContent = "Save Draft";

                const cancelEditBtn = document.createElement("button");
                cancelEditBtn.type = "button";
                cancelEditBtn.className = "cancel-edit-btn";
                cancelEditBtn.textContent = "Cancel";

                editorControls.append(saveDraftBtn, cancelEditBtn);
                editorPanel.append(subjectGroup, bodyGroup, editorControls, statusEl);

                getHasUnsavedEdits = () => {
                    return subjectInput.value.trim() !== savedSubject || bodyInput.value.trim() !== savedBody;
                };
                isEditorOpen = () => editorVisible;

                const onInput = () => {
                    if (unsavedWarning) unsavedWarning.textContent = "";
                    if (statusEl.className.includes("error")) statusEl.textContent = "";
                };
                subjectInput.addEventListener("input", onInput);
                bodyInput.addEventListener("input", onInput);

                function openEditor() {
                    editorVisible = true;
                    editorPanel.hidden = false;
                    emailBox.hidden = true;
                    editBtn.textContent = "👁️ View Email";
                    statusEl.textContent = "";
                    subjectInput.focus();
                }

                function closeEditor() {
                    editorVisible = false;
                    editorPanel.hidden = true;
                    emailBox.hidden = false;
                    editBtn.textContent = "✏️ Edit Email";
                }

                editBtn.addEventListener("click", () => {
                    if (editorVisible) {
                        closeEditor();
                    } else {
                        openEditor();
                    }
                });

                cancelEditBtn.addEventListener("click", () => {
                    subjectInput.value = savedSubject;
                    bodyInput.value = savedBody;
                    if (unsavedWarning) unsavedWarning.textContent = "";
                    statusEl.textContent = "";
                    closeEditor();
                });

                saveDraftBtn.addEventListener("click", async () => {
                    const newSub = subjectInput.value.trim();
                    const newBdy = bodyInput.value.trim();

                    if (!newSub) {
                        statusEl.className = "editor-status error";
                        statusEl.textContent = "Subject cannot be empty.";
                        subjectInput.focus();
                        return;
                    }
                    if (newSub.length > 300) {
                        statusEl.className = "editor-status error";
                        statusEl.textContent = "Subject must be 300 characters or less.";
                        subjectInput.focus();
                        return;
                    }
                    if (!newBdy) {
                        statusEl.className = "editor-status error";
                        statusEl.textContent = "Email body cannot be empty.";
                        bodyInput.focus();
                        return;
                    }
                    if (newBdy.length > 10000) {
                        statusEl.className = "editor-status error";
                        statusEl.textContent = "Email body must be 10,000 characters or less.";
                        bodyInput.focus();
                        return;
                    }

                    saveDraftBtn.disabled = true;
                    cancelEditBtn.disabled = true;
                    statusEl.className = "editor-status loading";
                    statusEl.textContent = "Saving draft to server...";

                    try {
                        const response = await apiRequest(`/api/actions/${action.action_id}/email`, "PUT", {
                            email: { subject: newSub, body: newBdy }
                        });
                        const updatedEmail = response.action && response.action.proposed_payload && response.action.proposed_payload.email;
                        if (updatedEmail) {
                            savedSubject = updatedEmail.subject || newSub;
                            savedBody = updatedEmail.body || newBdy;
                        } else {
                            savedSubject = newSub;
                            savedBody = newBdy;
                        }

                        subjectInput.value = savedSubject;
                        bodyInput.value = savedBody;
                        emailSub.textContent = `Subject: ${savedSubject}`;
                        emailBody.textContent = savedBody;

                        statusEl.className = "editor-status success";
                        statusEl.textContent = "✓ Draft saved. Review the email above before deciding.";
                        if (unsavedWarning) unsavedWarning.textContent = "";

                        closeEditor();

                        if (action.status === "APPROVED") {
                            await loadQueue();
                        }
                    } catch (err) {
                        statusEl.className = "editor-status error";
                        statusEl.textContent = `Save failed: ${err.message}`;
                    } finally {
                        saveDraftBtn.disabled = false;
                        cancelEditBtn.disabled = false;
                    }
                });
            }

            card.appendChild(emailHeader);
            card.appendChild(emailBox);
            if (editorPanel) {
                card.appendChild(editorPanel);
            }
        }

        if (payload.crm_field_changes) {
            addText(card, "h5", "Proposed CRM Field Changes").className = "action-section-title";
            addParagraph(card, JSON.stringify(payload.crm_field_changes));
        }

        if (action.decision_reason) {
            addText(card, "h5", "Decision Reason").className = "action-section-title";
            addParagraph(card, action.decision_reason);
        }

        if (action.execution_result) {
            addText(card, "h5", "Execution Result").className = "action-section-title";
            addParagraph(card, JSON.stringify(action.execution_result));
        }

        if (action.status === "PENDING") {
            const controls = document.createElement("div");
            controls.className = "action-controls";

            const approve = addText(controls, "button", "Approve");
            approve.type = "button";
            approve.className = "approve-button";

            const reject = addText(controls, "button", "Reject");
            reject.type = "button";
            reject.className = "reject-button";

            const reason = document.createElement("textarea");
            reason.className = "rejection-reason";
            reason.maxLength = 2000;
            reason.required = true;
            reason.placeholder = "Required reason for rejection (1–2000 characters)";

            unsavedWarning = document.createElement("div");
            unsavedWarning.className = "unsaved-warning";

            controls.append(approve, reject, reason, unsavedWarning);

            approve.addEventListener("click", () => {
                if (getHasUnsavedEdits()) {
                    unsavedWarning.textContent = "⚠️ You have unsaved email edits. Please save your draft or cancel changes before approving.";
                    return;
                }
                if (isEditorOpen()) {
                    unsavedWarning.textContent = "ℹ️ Please close or save the editor to review the final email before approving.";
                    return;
                }
                unsavedWarning.textContent = "";
                decide(action.action_id, "approve", null, [approve, reject]);
            });

            reject.addEventListener("click", () => {
                const trimmed = reason.value.trim();
                if (!trimmed) {
                    reason.setCustomValidity("A rejection reason is required.");
                    reason.reportValidity();
                    return;
                }
                if (trimmed.length > 2000) {
                    reason.setCustomValidity("Rejection reason must be 2000 characters or less.");
                    reason.reportValidity();
                    return;
                }
                reason.setCustomValidity("");
                if (unsavedWarning) unsavedWarning.textContent = "";
                decide(action.action_id, "reject", trimmed, [approve, reject]);
            });

            card.appendChild(controls);
        } else if (action.status === "APPROVED" && integrationConfigured) {
            const execute = addText(card, "button", "Execute approved action");
            execute.type = "button";
            execute.className = "proposal-button";
            execute.addEventListener("click", () => executeAction(action));
        }

        return card;
    }

    async function apiRequest(url, method = "GET", body) {
        const options = {
            method,
            credentials: "same-origin",
            headers: { "Accept": "application/json" }
        };
        if (body !== undefined) {
            options.headers["Content-Type"] = "application/json";
            options.headers["X-CSRFToken"] = csrfToken;
            options.body = JSON.stringify(body);
        }
        const response = await fetch(url, options);
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
            throw new Error(data.error || `Request failed (${response.status}).`);
        }
        return data;
    }

    async function loadQueue() {
        if (isQueueLoading) return;
        isQueueLoading = true;
        if (queueLoading) queueLoading.hidden = false;
        if (refreshQueue) refreshQueue.disabled = true;
        queueStatus.textContent = "";
        queueStatus.className = "queue-message";

        try {
            const data = await apiRequest("/api/actions");
            integrationConfigured = data.integration_configured === true;
            integrationStatus.textContent = integrationConfigured
                ? "Integration configured. Approval remains separate; execution requires explicit action."
                : "Integration not configured — approvals will wait; no email or CRM updates can run.";

            const actions = Array.isArray(data.actions) ? data.actions : [];
            const pendingActions = actions.filter(action => action.status === "PENDING");
            const pendingCount = pendingActions.length;

            queueBadge.textContent = String(pendingCount);
            queueBadge.setAttribute("aria-label", `${pendingCount} pending approval${pendingCount === 1 ? "" : "s"}`);
            if (pendingCount > 0) {
                queueBadge.classList.add("has-pending");
            } else {
                queueBadge.classList.remove("has-pending");
            }

            if (queueHeaderBadge) {
                queueHeaderBadge.textContent = String(pendingCount);
                if (pendingCount > 0) {
                    queueHeaderBadge.classList.add("has-pending");
                } else {
                    queueHeaderBadge.classList.remove("has-pending");
                }
            }

            queue.replaceChildren();
            if (!actions.length) {
                addText(queue, "p", "No saved proposals yet. Generate a brief and submit its draft for approval.");
                queue.lastElementChild.className = "empty-queue";
            } else {
                actions.forEach(action => queue.appendChild(renderAction(action)));
            }
            queueStatus.className = "queue-message";
            queueStatus.textContent = `${data.count} saved action${data.count === 1 ? "" : "s"} (${pendingCount} pending approval).`;
            return data;
        } catch (error) {
            queue.replaceChildren();
            queueStatus.className = "queue-message error";
            queueStatus.textContent = error.message || "Could not load the action queue.";
            integrationStatus.textContent = "Integration status unavailable.";
            throw error;
        } finally {
            isQueueLoading = false;
            if (queueLoading) queueLoading.hidden = true;
            if (refreshQueue) refreshQueue.disabled = false;
        }
    }

    async function decide(actionId, decision, reason, controlButtons) {
        if (controlButtons) {
            controlButtons.forEach(btn => btn.disabled = true);
        }
        queueStatus.className = "queue-message loading";
        queueStatus.textContent = `${decision === "approve" ? "Saving approval" : "Saving rejection"}…`;
        try {
            await apiRequest(
                `/api/actions/${encodeURIComponent(actionId)}/${decision}`,
                "POST",
                decision === "reject" ? { reason } : {}
            );
            queueStatus.className = "queue-message success";
            queueStatus.textContent = decision === "approve"
                ? "Approved — awaiting integration/execution. No action was executed."
                : "Rejected. This action cannot be executed.";
            await loadQueue();
        } catch (error) {
            queueStatus.className = "queue-message error";
            queueStatus.textContent = error.message || "Could not save the decision.";
            if (controlButtons) {
                controlButtons.forEach(btn => btn.disabled = false);
            }
        }
    }

    async function executeAction(action) {
        queueStatus.className = "queue-message loading";
        queueStatus.textContent = "Requesting explicit execution…";
        try {
            await apiRequest(
                `/api/actions/${encodeURIComponent(action.action_id)}/execute`,
                "POST",
                { payload: action.proposed_payload }
            );
            await loadQueue();
        } catch (error) {
            queueStatus.className = "queue-message error";
            queueStatus.textContent = error.message || "Execution was not completed.";
            await loadQueue();
        }
    }

    queueProposal.addEventListener("click", async () => {
        if (!currentDraft) return;
        if (queueProposal.disabled) return;

        queueProposal.disabled = true;
        proposalStatus.className = "proposal-status loading";
        proposalStatus.textContent = "Saving proposal for review…";

        let saveResponse;
        try {
            saveResponse = await apiRequest("/api/actions", "POST", {
                account_id: currentDraft.accountId,
                action_type: "customer_outreach_email",
                proposed_payload: {
                    proposed_action: currentDraft.action,
                    explanation: currentDraft.explanation,
                    email: {
                        subject: currentDraft.subject,
                        body: currentDraft.body
                    }
                },
                evidence_refs: currentDraft.evidence
            });
        } catch (saveError) {
            proposalStatus.className = "proposal-status error";
            proposalStatus.textContent = saveError.message || "Could not save the proposal.";
            queueProposal.disabled = false;
            return;
        }

        const savedAction = saveResponse && saveResponse.action;
        const actionId = savedAction ? savedAction.action_id : "";
        proposalStatus.className = "proposal-status success";
        proposalStatus.textContent = `Proposal saved as Pending (Action ID: ${actionId}). No email was sent and no CRM changes were made.`;
        queueProposal.hidden = true;

        try {
            await loadQueue();
        } catch (refreshError) {
            proposalStatus.className = "proposal-status warning";
            proposalStatus.replaceChildren();

            const warnMsg = document.createElement("p");
            warnMsg.textContent = `Proposal was saved (Action ID: ${actionId}), but the Action Queue could not be refreshed (${refreshError.message}).`;

            const retryBtn = document.createElement("button");
            retryBtn.type = "button";
            retryBtn.className = "retry-button";
            retryBtn.textContent = "Retry refreshing queue";
            retryBtn.addEventListener("click", async () => {
                retryBtn.disabled = true;
                retryBtn.textContent = "Refreshing…";
                try {
                    await loadQueue();
                    proposalStatus.className = "proposal-status success";
                    proposalStatus.textContent = `Proposal saved as Pending (Action ID: ${actionId}) and Action Queue refreshed.`;
                } catch (err) {
                    retryBtn.disabled = false;
                    retryBtn.textContent = "Retry refreshing queue";
                    warnMsg.textContent = `Proposal was saved (Action ID: ${actionId}), but refreshing failed: ${err.message}`;
                }
            });

            proposalStatus.append(warnMsg, retryBtn);
        }
    });

    if (refreshQueue) {
        refreshQueue.addEventListener("click", () => loadQueue().catch(() => {}));
    }

    form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const accountId = accountInput.value.trim();
        if (!accountId) return;

        button.disabled = true;
        status.textContent = "Generating brief… this may take a few minutes.";
        result.replaceChildren();

        try {
            const response = await fetch("/api/ai-agent/brief", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Accept": "application/json"
                },
                credentials: "same-origin",
                body: JSON.stringify({ account_id: accountId })
            });

            const data = await response.json().catch(() => ({}));

            if (!response.ok || !data.success) {
                throw new Error(data.error || `Request failed (${response.status}).`);
            }

            renderBrief(data.brief || {});
            status.textContent = "Brief generated successfully.";
        } catch (error) {
            status.textContent = error.message || "Could not generate the brief.";
        } finally {
            button.disabled = false;
        }
    });

    loadQueue().catch(() => {});
})();
</script>
