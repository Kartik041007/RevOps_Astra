<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>RevOps Astra — AI Robot</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            overflow: hidden;
            background:
                radial-gradient(ellipse at center, #ffffff 0%, #eef0ff 55%, #e5e8ff 100%);
            font-family: Inter, Arial, sans-serif;
            color: #202746;
        }

        .scene {
            width: min(900px, 100%);
            height: 650px;
            position: relative;
            display: grid;
            place-items: center;
            isolation: isolate;
        }

        .ambient {
            position: absolute;
            width: 390px;
            height: 390px;
            border-radius: 50%;
            background: radial-gradient(circle, #f9c66c50, #9d8bff20 60%, transparent 72%);
            filter: blur(8px);
            z-index: -2;
        }

        .robot-wrap {
            position: relative;
            width: 260px;
            height: 380px;
            animation: float 4s ease-in-out infinite;
            filter: drop-shadow(0 28px 24px #7c65b52c);
            z-index: 2;
        }

        .robot {
            position: absolute;
            inset: 0;
        }

        /* Head */
        .head {
            position: absolute;
            top: 15px;
            left: 28px;
            width: 204px;
            height: 157px;
            border-radius: 46% 46% 39% 39%;
            background: linear-gradient(145deg, #ffe7a0 0%, #f6c75c 28%, #d98b24 72%, #f4bd51 100%);
            box-shadow:
                inset 7px 7px 8px #fff4c9,
                inset -8px -9px 10px #b66a1d,
                0 9px 0 #d9a142;
            transform: rotate(-2deg);
        }

        .head::before {
            content: "";
            position: absolute;
            inset: 10px 10px 12px;
            border-radius: 45% 45% 36% 36%;
            border: 2px solid #ffedb7a0;
            box-shadow: inset 0 3px 5px #a9672e35;
        }

        /* Face screen */
        .face {
            position: absolute;
            left: 17px;
            top: 24px;
            width: 170px;
            height: 94px;
            border-radius: 44px;
            background: linear-gradient(155deg, #4e4b4a, #181c2a 50%, #4b4139);
            border: 5px solid #c99544;
            box-shadow:
                inset 0 5px 12px #0009,
                0 3px 2px #fff0b0;
            overflow: hidden;
        }

        .face::before {
            content: "";
            position: absolute;
            inset: 4px;
            border-radius: 35px;
            background: linear-gradient(145deg, #777b85, #d7d0c4 48%, #77757a);
            opacity: .85;
        }

        /* Eyes */
        .eye {
            position: absolute;
            top: 28px;
            width: 29px;
            height: 31px;
            border-radius: 50%;
            background:
                radial-gradient(circle at 34% 27%, white 0 10%, transparent 12%),
                radial-gradient(circle at 63% 70%, #070e28 0 30%, #203a70 43%, #5277a3 64%, #111a32 69%);
            border: 2px solid #b2b9c4;
            box-shadow: 0 2px 5px #1118;
            z-index: 1;
            animation: blink 5s infinite;
        }

        .eye.left {
            left: 31px;
        }

        .eye.right {
            right: 31px;
        }

        /* Side headphones */
        .ear {
            position: absolute;
            top: 61px;
            width: 26px;
            height: 53px;
            border-radius: 12px;
            background: linear-gradient(90deg, #bd711e, #ffe49a, #dc8d26);
            box-shadow: inset 3px 0 4px #fff5b4, 0 4px 5px #a8652b55;
        }

        .ear.left {
            left: 9px;
        }

        .ear.right {
            right: 9px;
        }

        /* Body */
        .body {
            position: absolute;
            top: 163px;
            left: 42px;
            width: 176px;
            height: 173px;
            border-radius: 43px 43px 37px 37px;
            background: linear-gradient(145deg, #fff0ad, #f4c55f 38%, #dc922c 76%, #f8ca68);
            border: 3px solid #e6af4a;
            box-shadow:
                inset 7px 7px 10px #fff6ca,
                inset -8px -7px 10px #c77a24,
                0 9px 0 #d28d32;
        }

        .body-panel {
            position: absolute;
            inset: 12px 10px 12px;
            border-radius: 34px;
            border: 2px solid #ffedb1;
            box-shadow: inset 0 5px 10px #d2913338;
        }

        .body-light {
            position: absolute;
            top: 29px;
            right: 23px;
            display: grid;
            gap: 7px;
        }

        .body-light i {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: linear-gradient(135deg, #56504b, #181c25);
            box-shadow: 0 1px 2px #fff3b0;
        }

        /* Arms */
        .arm {
            position: absolute;
            top: 190px;
            width: 38px;
            height: 109px;
            border-radius: 22px;
            background: linear-gradient(90deg, #c87520, #f9bf50 40%, #ffdb7d 70%, #d17d25);
            box-shadow: inset 5px 0 6px #ffe6a2, 0 7px 9px #b57a2b33;
        }

        .arm.left {
            left: 12px;
            transform: rotate(5deg);
        }

        .arm.right {
            right: 12px;
            transform: rotate(-5deg);
        }

        /* Floating words */
        .word {
            position: absolute;
            padding: 12px 17px;
            border: 1px solid #ffffffd9;
            border-radius: 14px;
            background: #ffffffbd;
            backdrop-filter: blur(12px);
            box-shadow: 0 12px 30px #6d69b21b;
            font-size: 13px;
            font-weight: 700;
            color: #5552a0;
            white-space: nowrap;
            animation: wordFloat 5s ease-in-out infinite;
        }

        .word span {
            margin-right: 7px;
        }

        .w1 {
            top: 125px;
            left: 8%;
            animation-delay: -.5s;
        }

        .w2 {
            top: 210px;
            right: 6%;
            animation-delay: -2s;
        }

        .w3 {
            bottom: 150px;
            left: 7%;
            animation-delay: -3s;
        }

        .w4 {
            bottom: 115px;
            right: 9%;
            animation-delay: -1s;
        }

        .w5 {
            top: 65px;
            right: 23%;
            animation-delay: -2.5s;
        }

        .orbit {
            position: absolute;
            width: 450px;
            height: 450px;
            border: 1px solid #aaa7e83d;
            border-radius: 50%;
            z-index: -1;
        }

        .orbit::before,
        .orbit::after {
            content: "";
            position: absolute;
            border: 1px dashed #9c97e84a;
            border-radius: 50%;
            inset: 28px;
        }

        .orbit::after {
            inset: 60px;
        }

        .caption {
            position: absolute;
            bottom: 24px;
            text-align: center;
        }

        .caption h2 {
            margin: 0;
            font-size: 25px;
            letter-spacing: -.7px;
        }

        .caption h2 span {
            color: #7c65e9;
        }

        .caption p {
            margin: 9px 0 0;
            color: #7d849d;
            font-size: 13px;
        }

        .online {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            margin-top: 13px;
            color: #299c72;
            font-size: 11px;
            font-weight: 700;
        }

        .online i {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #35d69a;
            box-shadow: 0 0 10px #35d69a;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0) rotate(-1deg);
            }

            50% {
                transform: translateY(-16px) rotate(1deg);
            }
        }

        @keyframes wordFloat {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-11px);
            }
        }

        @keyframes blink {

            0%,
            44%,
            48%,
            100% {
                transform: scaleY(1);
            }

            46% {
                transform: scaleY(.12);
            }
        }

        @media (max-width: 600px) {
            .scene {
                height: 620px;
                transform: scale(.82);
            }

            .w1 {
                left: 1%;
            }

            .w2 {
                right: 0;
            }

            .w3 {
                left: 0;
            }

            .w4 {
                right: 0;
            }

            .w5 {
                right: 5%;
            }
        }

        /* ASTRA AI brief interface */
        .agent-panel {
            position: absolute;
            top: 18px;
            left: 18px;
            z-index: 5;
            width: min(390px, 46%);
            max-height: calc(100% - 36px);
            overflow-y: auto;
            padding: 16px;
            border: 1px solid #ffffff;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.92);
            box-shadow: 0 12px 30px #5552a020;
            backdrop-filter: blur(12px);
        }

        .agent-panel h3 {
            margin: 0 0 8px;
            font-size: 18px;
        }

        .agent-panel p {
            margin: 0 0 12px;
            color: #68708a;
            font-size: 12px;
        }

        .agent-panel input,
        .agent-panel button {
            width: 100%;
            padding: 11px;
            border-radius: 10px;
            font: inherit;
        }

        .agent-panel input {
            margin-bottom: 8px;
            border: 1px solid #d9dced;
        }

        .agent-panel button {
            border: 0;
            background: #6555d9;
            color: white;
            font-weight: 700;
            cursor: pointer;
        }

        .agent-panel button:disabled {
            opacity: .6;
            cursor: wait;
        }

        .agent-result {
            margin-top: 14px;
            font-size: 13px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .agent-result h4 {
            margin: 12px 0 4px;
            color: #33316f;
        }

        .agent-result pre {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            font: inherit;
        }

        .queue-divider {
            border: 0;
            border-top: 1px solid #e5e7f2;
            margin: 18px 0;
        }

        .queue-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .queue-heading h3 {
            margin: 0;
        }

        .queue-heading button,
        .action-controls button,
        .proposal-button {
            width: auto;
            padding: 8px 10px;
            font-size: 12px;
        }

        .integration-note,
        .queue-message,
        .empty-queue {
            margin: 10px 0;
            color: #68708a;
            font-size: 12px;
            line-height: 1.5;
        }

        .queue-list {
            display: grid;
            gap: 10px;
        }

        .action-card {
            padding: 12px;
            border: 1px solid #e5e7f2;
            border-radius: 12px;
            background: #ffffffd9;
            overflow-wrap: anywhere;
        }

        .action-card h4 {
            margin: 0 0 6px;
            color: #33316f;
            font-size: 13px;
        }

        .action-card p,
        .action-card pre {
            margin: 5px 0;
            color: #68708a;
            font-size: 12px;
            line-height: 1.45;
            white-space: pre-wrap;
            font-family: inherit;
        }

        .action-status {
            display: inline-block;
            margin: 3px 0 8px;
            padding: 4px 8px;
            border-radius: 999px;
            background: #efefff;
            color: #4f46a5;
            font-size: 10px;
            font-weight: 800;
        }

        .action-status[data-status="REJECTED"],
        .action-status[data-status="FAILED"] {
            color: #a33d4b;
            background: #fff0f1;
        }

        .action-status[data-status="COMPLETED"] {
            color: #207752;
            background: #e9f8ef;
        }

        .action-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin-top: 10px;
        }

        .action-controls .reject-button {
            background: #9b4252;
        }

        .rejection-reason {
            width: 100%;
            min-height: 68px;
            margin-top: 8px;
            padding: 8px;
            border: 1px solid #d9dced;
            border-radius: 8px;
            resize: vertical;
            font: inherit;
            font-size: 12px;
        }

        .proposal-button {
            margin-top: 10px;
        }

        @media (max-width: 650px) {
            body {
                overflow: auto;
            }

            .scene {
                width: 100%;
                min-height: 100vh;
                height: auto;
                display: block;
                transform: none;
                padding: 12px;
            }

            .agent-panel {
                position: relative;
                top: auto;
                left: auto;
                width: 100%;
                max-height: min(78vh, 720px);
                margin: 0 auto 300px;
            }

            .robot-wrap {
                position: absolute;
                top: 410px;
                left: 50%;
                transform: translateX(-50%);
            }

            .caption {
                position: absolute;
                top: 770px;
                bottom: auto;
                width: calc(100% - 24px);
            }

            .word,
            .ambient,
            .orbit {
                display: none;
            }
        }
    </style>
</head>

<body>
    <div class="scene">

        <section class="agent-panel">
            <h3>✦ ASTRA Intelligence</h3>
            <p>Generate an evidence-based customer brief.</p>

            <form id="briefForm">
                <input id="accountId" name="account_id" type="text" maxlength="64"
                    placeholder="Enter account ID" required>
                <button id="generateBrief" type="submit">
                    Generate Customer Brief
                </button>
            </form>

            <div id="briefStatus" role="status" aria-live="polite"></div>
            <div id="briefResult" class="agent-result"></div>
            <button id="queueProposal" class="proposal-button" type="button" hidden>
                Submit email draft for approval
            </button>
            <div id="proposalStatus" class="queue-message" role="status" aria-live="polite"></div>

            <hr class="queue-divider">
            <div class="queue-heading">
                <h3>Action Queue</h3>
                <button id="refreshQueue" type="button">Refresh</button>
            </div>
            <p id="integrationStatus" class="integration-note">
                Integration status: checking configuration…
            </p>
            <div id="queueStatus" class="queue-message" role="status" aria-live="polite"></div>
            <div id="actionQueue" class="queue-list" aria-live="polite"></div>
        </section>

        <div class="ambient"></div>
        <div class="orbit"></div>

        <div class="word w1"><span>⚡</span>Customer Risk</div>
        <div class="word w2"><span>📊</span>Revenue Insights</div>
        <div class="word w3"><span>🛡️</span>Churn Alert</div>
        <div class="word w4"><span>✦</span>AI Intelligence</div>
        <div class="word w5"><span>◎</span>Account Health</div>

        <div class="robot-wrap">
            <div class="robot">
                <div class="ear left"></div>
                <div class="ear right"></div>

                <div class="head">
                    <div class="face">
                        <div class="eye left"></div>
                        <div class="eye right"></div>
                    </div>
                </div>

                <div class="arm left"></div>
                <div class="arm right"></div>

                <div class="body">
                    <div class="body-panel"></div>
                    <div class="body-light">
                        <i></i><i></i><i></i>
                    </div>
                </div>
            </div>
        </div>

        <div class="caption">
            <h2>Meet <span>ASTRA AI</span></h2>
            <p>Your intelligent revenue operations companion</p>
            <div class="online"><i></i> AI ASSISTANT READY</div>
        </div>
    </div>

<script>
(() => {
    const form = document.getElementById("briefForm");
    const accountInput = document.getElementById("accountId");
    const button = document.getElementById("generateBrief");
    const status = document.getElementById("briefStatus");
    const result = document.getElementById("briefResult");
    const queue = document.getElementById("actionQueue");
    const queueStatus = document.getElementById("queueStatus");
    const integrationStatus = document.getElementById("integrationStatus");
    const refreshQueue = document.getElementById("refreshQueue");
    const queueProposal = document.getElementById("queueProposal");
    const proposalStatus = document.getElementById("proposalStatus");
    const csrfToken = document.querySelector('meta[name="csrf-token"]')?.content || "";
    let currentDraft = null;
    let integrationConfigured = false;

    if (!form || !accountInput || !button || !status || !result || !queue) return;

    function addText(parent, tag, text) {
        const element = document.createElement(tag);
        element.textContent = text == null ? "" : String(text);
        parent.appendChild(element);
        return element;
    }

    function renderBrief(brief) {
        result.replaceChildren();

        const customer = brief.customer || {};
        const draft = brief.draft || {};

        addText(result, "h4", customer.company_name || brief.account_id);
        addText(
            result,
            "p",
            `Risk: ${customer.risk_level || "Unknown"} · Index: ${customer.risk_index ?? "N/A"}`
        );

        addText(result, "h4", "Issue Summary");
        addText(result, "p", draft.issue_summary || "No summary returned.");

        addText(result, "h4", "Recommended Next Action");
        addText(result, "p", draft.recommended_next_action || "No action returned.");

        addText(result, "h4", "Evidence Used");
        const evidence = Array.isArray(draft.evidence_used)
            ? draft.evidence_used
            : [];

        addText(
            result,
            "p",
            evidence.length ? evidence.join(", ") : "No source IDs returned."
        );

        addText(result, "h4", "Email Draft");
        addText(result, "p", `Subject: ${draft.email_subject || ""}`);
        const email = addText(result, "pre", draft.email_body || "");
        email.style.margin = "0";

        addText(
            result,
            "p",
            "Draft only — no email sent and no CRM changes made."
        );
        currentDraft = {
            accountId: accountInput.value.trim(),
            action: draft.recommended_next_action || "",
            explanation: draft.issue_summary || "",
            subject: draft.email_subject || "",
            body: draft.email_body || "",
            evidence: Array.isArray(draft.evidence_used) ? draft.evidence_used : []
        };
        queueProposal.hidden = !(
            currentDraft.action && currentDraft.explanation &&
            currentDraft.subject && currentDraft.body
        );
    }

    function addParagraph(parent, text) {
        const paragraph = document.createElement("p");
        paragraph.textContent = text || "";
        parent.appendChild(paragraph);
        return paragraph;
    }

    function statusLabel(status) {
        if (status === "APPROVED") return "Approved — awaiting integration/execution";
        return ({
            PENDING: "Pending",
            REJECTED: "Rejected",
            EXECUTING: "Executing",
            COMPLETED: "Completed",
            FAILED: "Failed",
            ON_HOLD: "On Hold"
        })[status] || status;
    }

    function renderAction(action) {
        const card = document.createElement("article");
        card.className = "action-card";

        addText(card, "h4", `Action ${action.action_id}`);
        addParagraph(card, `Account: ${action.account_id} · ${action.customer_name || "Unknown customer"}`);
        addParagraph(card, `Risk: ${action.risk_level || "Unknown"}`);

        const statusBadge = addText(card, "span", statusLabel(action.status));
        statusBadge.className = "action-status";
        statusBadge.dataset.status = action.status;

        const payload = action.proposed_payload || {};
        addText(card, "h4", "Proposed action");
        addParagraph(card, payload.proposed_action || "No action details.");
        addText(card, "h4", "Explanation");
        addParagraph(card, payload.explanation || "No explanation provided.");

        const evidence = Array.isArray(action.evidence_refs) ? action.evidence_refs : [];
        addText(card, "h4", "Supporting evidence");
        addParagraph(card, evidence.length ? evidence.join(", ") : "No evidence references.");

        if (payload.email) {
            addText(card, "h4", "Proposed email");
            addParagraph(card, `Subject: ${payload.email.subject || ""}`);
            const emailBody = document.createElement("pre");
            emailBody.textContent = payload.email.body || "";
            card.appendChild(emailBody);
        }
        if (payload.crm_field_changes) {
            addText(card, "h4", "Proposed CRM field changes");
            addParagraph(card, JSON.stringify(payload.crm_field_changes));
        } else {
            addText(card, "h4", "Proposed CRM field changes");
            addParagraph(card, "None proposed.");
        }
        if (action.decision_reason) {
            addText(card, "h4", "Decision reason");
            addParagraph(card, action.decision_reason);
        }
        if (action.execution_result) {
            addText(card, "h4", "Execution result");
            addParagraph(card, JSON.stringify(action.execution_result));
        }

        if (action.status === "PENDING") {
            const controls = document.createElement("div");
            controls.className = "action-controls";
            const approve = addText(controls, "button", "Approve");
            approve.type = "button";
            approve.addEventListener("click", () => decide(action.action_id, "approve"));

            const reject = addText(controls, "button", "Reject");
            reject.type = "button";
            reject.className = "reject-button";
            const reason = document.createElement("textarea");
            reason.className = "rejection-reason";
            reason.maxLength = 2000;
            reason.required = true;
            reason.placeholder = "Required reason for rejection";
            controls.append(approve, reject, reason);
            reject.addEventListener("click", () => {
                if (!reason.value.trim()) {
                    reason.setCustomValidity("A rejection reason is required.");
                    reason.reportValidity();
                    return;
                }
                reason.setCustomValidity("");
                decide(action.action_id, "reject", reason.value.trim());
            });
            card.appendChild(controls);
        } else if (action.status === "APPROVED" && integrationConfigured) {
            const execute = addText(card, "button", "Execute approved action");
            execute.type = "button";
            execute.addEventListener("click", () => executeAction(action));
        }
        return card;
    }

    async function apiRequest(url, method = "GET", body) {
        const options = {
            method,
            credentials: "same-origin",
            headers: { "Accept": "application/json" }
        };
        if (body !== undefined) {
            options.headers["Content-Type"] = "application/json";
            options.headers["X-CSRFToken"] = csrfToken;
            options.body = JSON.stringify(body);
        }
        const response = await fetch(url, options);
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
            throw new Error(data.error || `Request failed (${response.status}).`);
        }
        return data;
    }

    async function loadQueue() {
        queueStatus.textContent = "Loading actions…";
        try {
            const data = await apiRequest("/api/actions");
            integrationConfigured = data.integration_configured === true;
            integrationStatus.textContent = integrationConfigured
                ? "Integration configured. Approval remains separate; execution requires explicit action."
                : "Integration not configured — approvals will wait; no email or CRM updates can run.";
            queue.replaceChildren();
            if (!data.actions.length) {
                addText(queue, "p", "No saved proposals yet. Generate a brief and submit its draft for approval.");
                queue.lastElementChild.className = "empty-queue";
            } else {
                data.actions.forEach(action => queue.appendChild(renderAction(action)));
            }
            queueStatus.textContent = `${data.count} saved action${data.count === 1 ? "" : "s"}.`;
        } catch (error) {
            queue.replaceChildren();
            queueStatus.textContent = error.message || "Could not load the action queue.";
            integrationStatus.textContent = "Integration status unavailable.";
        }
    }

    async function decide(actionId, decision, reason) {
        queueStatus.textContent = `${decision === "approve" ? "Saving approval" : "Saving rejection"}…`;
        try {
            await apiRequest(
                `/api/actions/${encodeURIComponent(actionId)}/${decision}`,
                "POST",
                decision === "reject" ? { reason } : {}
            );
            queueStatus.textContent = decision === "approve"
                ? "Approved — awaiting integration/execution. No action was executed."
                : "Rejected. This action cannot be executed.";
            await loadQueue();
        } catch (error) {
            queueStatus.textContent = error.message || "Could not save the decision.";
        }
    }

    async function executeAction(action) {
        queueStatus.textContent = "Requesting explicit execution…";
        try {
            await apiRequest(
                `/api/actions/${encodeURIComponent(action.action_id)}/execute`,
                "POST",
                { payload: action.proposed_payload }
            );
            await loadQueue();
        } catch (error) {
            queueStatus.textContent = error.message || "Execution was not completed.";
            await loadQueue();
        }
    }

    queueProposal.addEventListener("click", async () => {
        if (!currentDraft) return;
        queueProposal.disabled = true;
        proposalStatus.textContent = "Saving proposal…";
        try {
            await apiRequest("/api/actions", "POST", {
                account_id: currentDraft.accountId,
                action_type: "customer_outreach_email",
                proposed_payload: {
                    proposed_action: currentDraft.action,
                    explanation: currentDraft.explanation,
                    email: {
                        subject: currentDraft.subject,
                        body: currentDraft.body
                    }
                },
                evidence_refs: currentDraft.evidence
            });
            proposalStatus.textContent = "Proposal saved as Pending. No email was sent and no CRM changes were made.";
            queueProposal.hidden = true;
            await loadQueue();
        } catch (error) {
            proposalStatus.textContent = error.message || "Could not save the proposal.";
        } finally {
            queueProposal.disabled = false;
        }
    });

    refreshQueue.addEventListener("click", loadQueue);

    form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const accountId = accountInput.value.trim();
        if (!accountId) return;

        button.disabled = true;
        status.textContent = "Generating brief… this may take a few minutes.";
        result.replaceChildren();

        try {
            const response = await fetch("/api/ai-agent/brief", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Accept": "application/json"
                },
                credentials: "same-origin",
                body: JSON.stringify({ account_id: accountId })
            });

            const data = await response.json().catch(() => ({}));

            if (!response.ok || !data.success) {
                throw new Error(data.error || `Request failed (${response.status}).`);
            }

            renderBrief(data.brief || {});
            status.textContent = "Brief generated successfully.";
        } catch (error) {
            status.textContent = error.message || "Could not generate the brief.";
        } finally {
            button.disabled = false;
        }
    });
    loadQueue();
})();
</script>


</body>

</html>
